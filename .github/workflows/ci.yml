name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run
        type: choice
        options: [full, desktop, terminal]
        default: full
      publish_preview:
        description: Publish the selected desktop or terminal dependency release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pipx install ruff
      - run: npm ci
      - run: npm run build:terminal
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  python-3-9:
    if: inputs.suite == 'full'
    # Target runtimes support Python 3.9.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:terminal
      - run: python -m unittest discover -s tests/runtime

  desktop:
    if: inputs.suite == 'desktop'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      publish: ${{ inputs.publish_preview }}

  terminal:
    if: inputs.suite == 'terminal'
    permissions:
      contents: write
    uses: ./.github/workflows/terminal.yml
    with:
      publish: ${{ inputs.publish_preview }}
