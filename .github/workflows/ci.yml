name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run
        type: choice
        options: [full, desktop, terminal]
        default: full
      publish_preview:
        description: Publish the selected desktop or Outpost machine service release
        type: boolean
        default: false
      terminal_tests:
        description: Run tests when building Outpost machine service
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth xclip python3-gi gir1.2-gtk-3.0
      - run: pipx install ruff
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run build:terminal
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build:terminal -- --fixtures
      - run: npm run build:terminal -- x64-musl
      - run: docker build -t outpost-openrc-test -f tests/fixtures/OpenRC.Dockerfile tests/fixtures
      - run: npm run test:integration
        env:
          OUTPOST_OPENRC_TEST_IMAGE: outpost-openrc-test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:mobile

  desktop:
    if: inputs.suite == 'desktop'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      publish: ${{ inputs.publish_preview }}

  terminal:
    if: inputs.suite == 'terminal'
    permissions:
      contents: write
    uses: ./.github/workflows/terminal.yml
    with:
      publish: ${{ inputs.publish_preview }}
      run_tests: ${{ inputs.terminal_tests }}
