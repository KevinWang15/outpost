[package]
name = "outpost-desktop"
version = "1.2.0"
edition = "2024"
license = "MIT"

[lib]
path = "native/lib.rs"

[features]
ui-tests = ["gpui_platform/test-support"]

[[test]]
name = "workspace"
path = "tests/workspace.rs"
harness = false
required-features = ["ui-tests"]

[[bin]]
name = "outpost"
path = "native/main.rs"

[dependencies]
gpui = { git = "https://github.com/KevinWang15/gpui", branch = "main", default-features = false, features = ["components", "lucide"] }
gpui_platform = { git = "https://github.com/KevinWang15/gpui", branch = "main", default-features = false, features = ["font-kit", "wayland", "x11"] }
alacritty_terminal = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
portable-pty = "0.9"
anyhow = "1"
async-channel = "2"
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
directories = "6"
getrandom = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSString"] }
