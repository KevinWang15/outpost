<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outpost</title>
    <link rel="stylesheet" href="home.css" />
    <script src="home.js" defer></script>
  </head>
  <body>
    <main>
      <img src="outpost.png" width="56" height="56" alt="" />
      <h1>Outpost</h1>
      <p>Open your Outpost server to choose a coding session. Connect with <strong>Outpost Desktop</strong> to bring it here.</p>
      <form>
        <label for="server">Outpost server</label>
        <div class="address"><input id="server" type="url" placeholder="https://outpost.example.com" required autocomplete="url" /><button type="submit">Open Outpost</button></div>
      </form>
      <p role="status" aria-live="polite"></p>
      <ul id="servers" aria-label="Trusted servers"></ul>
      <p class="hint">Forgetting a server closes its desktop windows. Remote sessions keep running.</p>
      <footer><span id="version"></span><button id="updates">Check for updates</button></footer>
    </main>
  </body>
</html>
